version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # First-party shared composite actions are intentionally tracked on @main.
      - dependency-name: "wp-media/workflows"
